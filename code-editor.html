<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum AI IDE - Code Editor</title>
<style>
body{background:#0a0f1a;color:#cfddee;font-family:Arial;padding:20px;}
h1{color:#0ff;}
button{
padding:10px 16px;
margin:5px;
background:#111827;
color:#0ff;
border:1px solid #2a4f6e;
border-radius:10px;
}
textarea{
width:100%;
height:300px;
background:#111827;
color:#0ff;
border:1px solid #2a4f6e;
padding:16px;
font-family:monospace;
border-radius:12px;
}
.output{
margin-top:20px;
padding:16px;
background:#111827;
border-radius:12px;
white-space:pre-wrap;
}
</style>
</head>
<body>

<h1>💻 Quantum Code Editor</h1>

<button onclick="runCode()">▶ Run</button>
<button onclick="copyCode()">📋 Copy</button>
<button onclick="saveCode()">💾 Save</button>
<button onclick="clearCode()">🗑 Clear</button>

<textarea id="editor">qubit q0
H q0
measure q0</textarea>

<div class="output" id="output">Output will appear here...</div>

<script>
function runCode(){
let code=document.getElementById("editor").value;
let out="Running...\n\n";
if(code.includes("H")) out+="✓ Hadamard gate applied\n";
if(code.includes("measure"))
out+="✓ Measurement complete\n\n|0> 50%\n|1> 50%";
document.getElementById("output").innerText=out;
}
function copyCode(){
let e=document.getElementById("editor");
e.select();
document.execCommand("copy");
}
function saveCode(){
localStorage.setItem("quantumCode",
document.getElementById("editor").value);
}
function clearCode(){
document.getElementById("editor").value="";
}
</script>

</body>
</html>
