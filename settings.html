<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Quantum AI IDE</title>
<style>
/* --- CRITICAL: navbar + base (inline) --- */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #0ff;
  --primary-hover: #3cf;
  --primary-light: rgba(0,255,255,0.1);
  --bg: #0a0f1a;
  --bg-gradient: linear-gradient(135deg, #0a0f1a, #0a1a2a);
  --card: rgba(10,20,35,0.85);
  --text: #cfddee;
  --text-muted: #6a8aaa;
  --border: #2a4f6e;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
  --radius: 12px;
  --radius-sm: 8px;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-gradient);
  color: var(--text);
  min-height: 100vh;
  padding-top: 56px;
}
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex; align-items: center;
  padding: 0 12px;
  height: 56px;
  gap: 4px;
}
.nav-toggle { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.nav-hamburger {
  display: none;
  font-size: 24px; cursor: pointer; padding: 4px 8px;
  border-radius: 8px; user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.nav-hamburger:hover { background: var(--primary-light); }
.nav-hamburger::before { content: '\2630'; }
.nav-toggle:checked ~ .nav-hamburger {
  background: var(--primary-light);
  color: var(--primary);
}
.nav-toggle:checked ~ .nav-hamburger::before { content: '\2715'; }
.navbar .brand {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; margin-right: auto;
  color: var(--text);
  text-decoration: none;
}
.navbar .brand span { color: var(--primary); }
.nav-menu {
  display: flex; align-items: center; gap: 4px;
}
.nav-link {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--text-muted);
  text-decoration: none;
  transition: all .2s;
  white-space: nowrap;
}
.nav-link:hover { background: var(--primary-light); color: var(--primary); }
.nav-link.active { background: var(--primary); color: #000; font-weight: 700; }
@media (max-width: 768px) {
  .nav-hamburger { display: block; }
  .nav-menu {
    display: none;
    position: fixed; top: 56px; left: 0; right: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    padding: 8px;
    flex-direction: column;
    gap: 2px;
    z-index: 99;
    animation: slideDown .2s ease;
  }
  @keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .nav-toggle:checked ~ .nav-menu { display: flex; }
  .nav-menu .nav-link {
    display: block;
    width: 100%; padding: 12px 16px;
    font-size: 15px; border-radius: 8px;
  }
  .nav-menu .nav-link.active {
    background: var(--primary);
    color: #000;
  }
}
@media (max-width: 480px) {
  .navbar .brand { font-size: 14px; }
}
/* --- Settings specific --- */
.container { max-width: 700px; margin: 0 auto; padding: 20px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.form-group input, .form-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  color: var(--text);
  font-size: 14px;
}
.btn-group { display: flex; gap: 10px; margin-top: 20px; }
.btn { padding: 10px 16px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
.btn-primary { background: var(--primary); color: #000; font-weight: 600; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(10,20,35,0.95);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 20px;
  color: var(--text); font-size: 14px;
  opacity: 0; transition: opacity 0.3s;
  z-index: 1000;
}
#toast.show { opacity: 1; }
.footer {
  margin-top: 40px; padding: 20px; text-align: center;
  border-top: 1px solid var(--border);
  color: var(--text-muted); font-size: 13px;
}
.footer a { color: var(--primary); text-decoration: none; margin: 0 10px; }
</style>
</head>
<body>
<nav class="navbar">
<input type="checkbox" id="navToggle" class="nav-toggle">
<a href="./index.html" class="brand">⚛️ Quantum AI IDE</a>
<label for="navToggle" class="nav-hamburger"></label>
<div class="nav-menu">
<a href="./index.html" class="nav-link">🏠 Home</a>
<a href="./playground.html" class="nav-link">🧪 Playground</a>
<a href="./quantum-ai-ide.html" class="nav-link">🤖 AI Assistant</a>
<a href="./quantum-ai-ide.html" class="nav-link">🔲 Circuits</a>
<a href="./quantum-ai-ide.html" class="nav-link">💻 Editor</a>
<a href="./settings.html" class="nav-link active" aria-current="page">⚙️ Settings</a>
</div>
</nav>

<div class="container">
  <div class="card">
    <div class="card-header">🎨 Theme Settings</div>
    <div class="form-group">
      <label>Accent Color</label>
      <input type="color" id="themeColor" value="#0ff" style="height: 44px; cursor: pointer;">
    </div>
    <div class="form-group">
      <label>Language</label>
      <select id="language">
        <option value="en">English</option>
        <option value="gu">Gujarati</option>
        <option value="hi">Hindi</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-header">🔌 API Provider Settings</div>
    <div class="form-group">
      <label>Default Quantum Provider</label>
      <select id="providerSelect">
        <option value="local">Local Simulator</option>
        <option value="ibm">IBM Quantum</option>
        <option value="simulator">Quantum Simulator</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-header">💾 Auto-Save</div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="autoSave" checked> Enable Auto-Save
      </label>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" onclick="saveSettings()">💾 Save Settings</button>
    <button class="btn btn-outline" onclick="resetSettings()">🔄 Reset</button>
  </div>
</div>

<div id="toast"></div>

<script>
function saveSettings() {
  const settings = {
    themeColor: document.getElementById('themeColor').value,
    language: document.getElementById('language').value,
    provider: document.getElementById('providerSelect').value,
    autoSave: document.getElementById('autoSave').checked
  };
  localStorage.setItem('quantumSettings', JSON.stringify(settings));
  showToast('✅ Settings saved!', 'success');
}

function resetSettings() {
  localStorage.removeItem('quantumSettings');
  document.getElementById('themeColor').value = '#0ff';
  document.getElementById('language').value = 'en';
  document.getElementById('providerSelect').value = 'local';
  document.getElementById('autoSave').checked = true;
  showToast('🔄 Settings reset!', 'info');
}

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show';
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Load settings on init
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('quantumSettings');
  if (saved) {
    const settings = JSON.parse(saved);
    document.getElementById('themeColor').value = settings.themeColor || '#0ff';
    document.getElementById('language').value = settings.language || 'en';
    document.getElementById('providerSelect').value = settings.provider || 'local';
    document.getElementById('autoSave').checked = settings.autoSave !== false;
  }
  // Mobile navbar toggle
  const toggle = document.getElementById('navToggle');
  const label = document.querySelector('.nav-hamburger');
  const menu = document.querySelector('.nav-menu');
  if (toggle && label && menu) {
    label.addEventListener('click', function(e) {
      e.preventDefault();
      toggle.checked = !toggle.checked;
      menu.style.display = toggle.checked ? 'flex' : '';
    });
    menu.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        toggle.checked = false;
        menu.style.display = '';
      });
    });
  }
});
</script>
</body>
</html>
