<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ટાઇમટેબલ</title>
<style>
/* --- CRITICAL: navbar + base (inline) --- */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #0ff;
  --primary-hover: #3cf;
  --primary-light: rgba(0,255,255,0.1);
  --bg: #0a0f1a;
  --card: rgba(10,20,35,0.85);
  --text: #cfddee;
  --text-muted: #6a8aaa;
  --border: #2a4f6e;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
  --radius: 12px;
  --radius-sm: 8px;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-gradient);
  color: var(--text);
  min-height: 100vh;
  padding-top: 56px;
}
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex; align-items: center;
  padding: 0 12px;
  height: 56px;
  gap: 4px;
}
.nav-toggle { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.nav-hamburger {
  display: none;
  font-size: 24px; cursor: pointer; padding: 4px 8px;
  border-radius: 8px; user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.nav-hamburger:hover { background: var(--bg-gradient); }
.nav-hamburger::before { content: '\2630'; }
.nav-toggle:checked ~ .nav-hamburger {
  background: var(--primary-light);
  color: var(--primary);
}
.nav-toggle:checked ~ .nav-hamburger::before { content: '\2715'; }
.navbar .brand {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; margin-right: auto;
  color: var(--text);
  text-decoration: none;
}
.navbar .brand span { color: var(--primary); }
.nav-menu {
  display: flex; align-items: center; gap: 4px;
}
.nav-link {
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--text-muted);
  text-decoration: none;
  transition: all .2s;
  white-space: nowrap;
}
.nav-link:hover { background: var(--primary-light); color: var(--primary); }
.nav-link.active { background: var(--primary); color: #000; font-weight: 700; }
@media (max-width: 768px) {
  .nav-hamburger { display: block; }
  .nav-menu {
    display: none;
    position: fixed; top: 56px; left: 0; right: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    padding: 8px;
    flex-direction: column;
    gap: 2px;
    z-index: 99;
    animation: slideDown .2s ease;
  }
  @keyframes slideDown {
    from { transform: translateY(-10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .nav-toggle:checked ~ .nav-menu { display: flex; }
  .nav-menu .nav-link {
    display: block;
    width: 100%; padding: 12px 16px;
    font-size: 15px; border-radius: 8px;
  }
  .nav-menu .nav-link.active {
    background: var(--primary);
    color: #000;
  }
}
@media (max-width: 480px) {
  .navbar .brand { font-size: 14px; }
  .navbar .brand span { display: none; }
}
@media (max-width: 360px) {
  .navbar .brand { font-size: 13px; }
}
/* --- end critical --- */
</style>
<link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>
<nav class="navbar">
<input type="checkbox" id="navToggle" class="nav-toggle">
<a href="/" class="brand">🏫 <span>સમયપત્રક</span></a>
<label for="navToggle" class="nav-hamburger"></label>
<div class="nav-menu">
<a href="/" class="nav-link">🏠 હોમ</a>
<a href="/classes" class="nav-link">🏫 ક્લાસ</a>
<a href="/subjects" class="nav-link">📚 વિષયો</a>
<a href="/teachers" class="nav-link">👨‍🏫 શિક્ષકો</a>
<a href="/timetable" class="nav-link active" aria-current="page">📅 ટાઇમટેબલ</a>
<a href="/playground" class="nav-link">🧪 પ્લેગ્રાઉન્ડ</a>
                    <a href="/settings" class="nav-link">⚙️ સેટિંગ</a>
</div>
</nav>
<div class="container">
<div class="card">
<div class="card-header">
📅 ટાઇમટેબલ
<select id="classSelect" onchange="changeClass(this.value)" style="margin-left:auto;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;min-height:40px;min-width:90px"></select>
<button class="btn btn-success btn-sm" onclick="handleGen(this)">🤖 ઓટો</button>
<button class="btn btn-outline btn-sm" onclick="expCSV()">📥 CSV</button>
<button class="btn btn-outline btn-sm" onclick="window.print()">🖨️</button>
</div>
</div>
<div id="ttArea">
<div class="empty-state">
<div class="icon">📅</div>
<h2>ટાઇમટેબલ લોડ થાય છે...</h2>
</div>
</div>
</div>
<!-- Cell Edit Modal -->
<div class="modal-overlay" id="cellModal">
<div class="modal">
<h3 id="cellTitle">✏️ એડિટ કરો</h3>
<div class="form-group">
<label>વિષય</label>
<select id="cellSubject" onchange="updateTeachers()"></select>
</div>
<div class="form-group">
<label>શિક્ષક</label>
<select id="cellTeacher"></select>
</div>
<div class="modal-actions">
<button class="btn btn-outline" onclick="closeModal('cellModal')">રદ કરો</button>
<button class="btn btn-primary" onclick="saveCell()">💾 સેવ</button>
</div>
</div>
</div>
<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/chat.js?v=1"></script>
<script>
let currentClass = '';
let editCtx = {};
async function init() {
const params = new URLSearchParams(window.location.search);
if (params.get('class')) currentClass = params.get('class');
try {
const clsRes = await API.getClasses();
const sel = document.getElementById('classSelect');
sel.innerHTML = clsRes.classes.map(c => 
`<option value="${c}" ${c === currentClass ? 'selected' : ''}>ધોરણ ${c}</option>`
).join('');
// Set first class as default if none selected
if (!currentClass && clsRes.classes.length > 0) {
currentClass = clsRes.classes[0];
sel.value = currentClass;
}
if (!currentClass) {
document.getElementById('ttArea').innerHTML = 
'<div class="empty-state"><div class="icon">🏫</div><h2>કોઈ ક્લાસ નથી</h2><p>પહેલા "ક્લાસ" પેજમાં જઈને ક્લાસ ઉમેરો</p></div>';
return;
}
await loadTimetable(currentClass);
} catch(e) {
document.getElementById('ttArea').innerHTML = 
'<div class="empty-state"><div class="icon">⚠️</div><h2>સર્વર કનેક્શન એરર</h2></div>';
}
}
async function loadTimetable(cls) {
const area = document.getElementById('ttArea');
try {
const [ttRes, setRes, dcRes] = await Promise.all([
API.getTimetable(cls),
API.getSettings(),
API.getDayConfig()
]);
const tt = ttRes.timetable || {};
const s = setRes;
const dayConfigs = dcRes.configs || [];
// Calculate periods per day and max
const periodsPerDay = {};
let maxPeriods = 0;
for (const cfg of dayConfigs) {
const total = (cfg.periods_before || 0) + (cfg.periods_after || 0);
periodsPerDay[cfg.day_index] = total;
if (total > maxPeriods) maxPeriods = total;
}
// Check if empty
let cellCount = 0;
for (const di of Object.keys(tt)) {
for (const pi of Object.keys(tt[di])) {
if (tt[di][pi] && tt[di][pi].subject) cellCount++;
}
}
if (cellCount === 0) {
area.innerHTML = `<div class="empty-state">
<div class="icon">📅</div>
<h2>${cls} માટે ટાઇમટેબલ નથી</h2>
<p>"ઓટો" બટન દબાવો અથવા સેલ પર ક્લિક કરીને ભરો</p>
<button class="btn btn-success btn-lg" onclick="handleGen(this)">🤖 ઓટો જનરેટ</button>
</div>`;
return;
}
let html = '<div class="table-wrap"><table><thead><tr><th>સમય / વાર</th>';
DAYS.forEach(d => { html += `<th>${d}</th>`; });
html += '</tr></thead><tbody>';
for (let pi = 0; pi < maxPeriods; pi++) {
html += `<tr><td style="background:#f1f5f9;font-weight:600;text-align:left;padding-left:12px">પિરિયડ ${pi+1}</td>`;
for (let di = 0; di < 6; di++) {
if (pi >= (periodsPerDay[di] || 0)) {
html += `<td style="background:var(--bg);color:var(--text-muted);font-size:11px">—</td>`;
continue;
}
const cell = tt[di] ? tt[di][pi] : null;
if (cell && cell.subject) {
const c = subjColor(cell.subject);
html += `<td onclick="openEdit('${cls}',${di},${pi})" style="border-left:3px solid ${c}">
<strong style="font-size:12px">${cell.subject}</strong><br>
<small style="color:var(--text-muted)">👤 ${cell.teacher || '—'}</small>
</td>`;
} else {
html += `<td onclick="openEdit('${cls}',${di},${pi})" style="color:var(--text-muted);font-size:11px">—</td>`;
}
}
html += '</tr>';
}
html += '</tbody></table></div>';
area.innerHTML = html;
} catch(e) {
area.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h2>લોડ કરવામાં એરર</h2><p>${e.message}</p></div>`;
}
}
function changeClass(cls) {
currentClass = cls;
loadTimetable(cls);
}
// Cell editing
async function openEdit(cls, di, pi) {
editCtx = { cls, di, pi };
document.getElementById('cellTitle').textContent = `✏️ ધોરણ ${cls} — ${DAYS[di]}, પિરિયડ ${pi+1}`;
const ss = document.getElementById('cellSubject');
ss.innerHTML = '<option value="">— પસંદ કરો —</option>';
try {
const subjRes = await API.getSubjects(cls);
const subjects = Object.keys(subjRes.subjects || {});
subjects.forEach(s => {
const o = document.createElement('option');
o.value = s; o.textContent = s;
ss.appendChild(o);
});
// Get current cell value
const ttRes = await API.getTimetable(cls);
const cell = (ttRes.timetable || {})[di] ? ttRes.timetable[di][pi] : null;
if (cell && cell.subject) ss.value = cell.subject;
await updateTeachers();
const ts = document.getElementById('cellTeacher');
if (cell && cell.teacher) {
for (const opt of ts.options) {
if (opt.value === cell.teacher) { ts.value = cell.teacher; break; }
}
}
} catch(e) {}
openModal('cellModal');
}
async function updateTeachers() {
const subj = document.getElementById('cellSubject').value;
const ts = document.getElementById('cellTeacher');
ts.innerHTML = '<option value="">— કોઈ નહિ —</option>';
try {
if (subj) {
const tRes = await API.getTeachers();
(tRes.teachers || []).forEach(t => {
if (t.subjects.includes(subj)) {
const o = document.createElement('option');
o.value = t.name; o.textContent = t.name;
ts.appendChild(o);
}
});
}
} catch(e) {}
}
async function saveCell() {
const { cls, di, pi } = editCtx;
const subj = document.getElementById('cellSubject').value;
const teacher = document.getElementById('cellTeacher').value;
if (!subj) { showToast('⚠️ વિષય પસંદ કરો', 'error'); return; }
try {
await API.updateCell(cls, { day_index: di, period_index: pi, subject: subj, teacher: teacher || '—' });
closeModal('cellModal');
loadTimetable(cls);
showToast('✅ સેવ થયું', 'success');
} catch(e) {
showToast('⚠️ એરર: ' + e.message, 'error');
}
}
async function handleGen(btn) {
if (!btn) btn = document.querySelector('.btn-success');
btn.disabled = true; btn.innerHTML = '⏳...';
try {
const res = await API.generate();
showToast(res.message, res.success ? 'success' : 'error');
loadTimetable(currentClass);
} catch(e) { showToast('⚠️ એરર', 'error'); }
btn.disabled = false; btn.innerHTML = '🤖 ઓટો';
}
function expCSV() {
API.exportCSV(currentClass);
}
init();
</script>

<script>
// Mobile navbar toggle — reliable for all browsers
document.addEventListener('DOMContentLoaded', function() {
  var toggle = document.getElementById('navToggle');
  var label = document.querySelector('.nav-hamburger');
  var menu = document.querySelector('.nav-menu');
  if (toggle && label && menu) {
    label.addEventListener('click', function(e) {
      e.preventDefault();
      toggle.checked = !toggle.checked;
      // Also toggle a class for browsers where :checked ~ selector is flaky
      if (toggle.checked) {
        menu.style.display = 'flex';
      } else {
        menu.style.display = '';
      }
    });
    // Also close menu when a link is clicked
    menu.querySelectorAll('.nav-link').forEach(function(link) {
      link.addEventListener('click', function() {
        toggle.checked = false;
        menu.style.display = '';
      });
    });
  }
});
</script>

<script>
// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    console.log('✅ SW registered');
  }).catch(err => {
    console.log('SW registration failed:', err);
  });
}
</script>
</body>
</html>
